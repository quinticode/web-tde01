<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>                      </title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>BEM-VINDO AO SITE MUITO MALUCO!!!</h1>
    <p id="pontuacao">PONTOS: 0</p>

    <button id="botao">GANHAR PONTOS</button>

    <label for="input-1">DIGITE O PRIMEIRO NUMERO</label>
    <input type="text" id="input-1">

    <label for="operacao">ESCOLHA A OPERAÇÃO</label>
    <select name="Operação" id="operacao">
        <option value="soma">+</option>
        <option value="subtracao">-</option>
        <option value="multiplicacao">*</option>
        <option value="divisao">/</option>
    </select>
    
    <label for="input-2">DIGITE O SEGUNDO NUMERO</label>
    <input type="text" id="input-2">

    <p id="resultado">RESULTADO: --</p>
    
</body>
</html>
